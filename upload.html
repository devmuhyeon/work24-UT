<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>고용24 사용자 조사 - 결과 전송</title>

<link rel="stylesheet" href="/work24-UT/css/reset.css">
<link rel="stylesheet" href="/work24-UT/css/font.css">
<link rel="stylesheet" href="/work24-UT/css/common.css">
<link rel="stylesheet" href="/work24-UT/css/survey.css">
<link rel="stylesheet" href="/work24-UT/css/upload.css">

</head>

<body>
<div class="result_wrap">

	<div class="loading_card">

		<strong class="result_title">결과를 전송하고 있습니다</strong>

		<p
			class="result_message"
			role="status"
			aria-live="polite">

			잠시만 기다려주세요.

		</p>

		<div class="loading_bar" aria-hidden="true"></div>

	</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/work24-UT/js/ut-common.js"></script>

<script>
$(function() {

	UT.sendResult(

		function() {

			$('.loading_spinner').hide();
			$('.loading_bar').hide();

			$('.result_title')
				.text('전송이 완료되었습니다.');

			$('.result_message')
				.text('참여해주셔서 감사합니다.');

		},

		function() {

			$('.loading_spinner').hide();
			$('.loading_bar').hide();

			$('.result_title')
				.text('전송에 실패했습니다.');

			$('.result_message')
				.text('새로고침 후 다시 시도하거나 담당자에게 문의해주세요.');

		}

	);

});
</script>

</body>
</html>
