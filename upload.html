<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>고용24 사용자 조사 - 결과 전송</title>

<link rel="stylesheet" href="/work24-UT/css/reset.css">
<link rel="stylesheet" href="/work24-UT/css/font.css">
<link rel="stylesheet" href="/work24-UT/css/common.css">
<link rel="stylesheet" href="/work24-UT/css/survey.css">


<style>
.result_wrap{
	position:fixed;
	inset:0;
	display:flex;
	align-items:center;
	justify-content:center;
	padding:2.4rem;
	background:
		radial-gradient(circle at 50% 35%, #eef3ff 0, #f8faff 36%, #fff 72%);
	z-index:9999;
}

.loading_card{
	width:min(42rem, 100%);
	padding:4rem 3.2rem;
	border:1px solid rgba(63, 88, 212, 0.14);
	border-radius:2.4rem;
	background:rgba(255, 255, 255, 0.88);
	box-shadow:0 2.4rem 6rem rgba(31, 41, 55, 0.14);
	text-align:center;
}

.loading_spinner{
	width:3.2rem;
	height:3.2rem;
	border:0.4rem solid #dbe4ff;
	border-top-color:#3f58d4;
	border-radius:50%;
	animation:spinnerRotate 0.9s linear infinite;
}

.result_title{
	margin:0 0 1rem;
	font-size:2.4rem;
	font-weight:800;
	line-height:1.35;
	color:#111827;
}

.result_message{
	margin:0;
	font-size:1.6rem;
	font-weight:500;
	line-height:1.6;
	color:#4b5563;
}

.loading_bar{
	position:relative;
	width:100%;
	height:0.8rem;
	margin-top:2.8rem;
	border-radius:999px;
	background:#e5e7eb;
	overflow:hidden;
}

.loading_bar::after{
	content:'';
	position:absolute;
	left:-45%;
	top:0;
	width:45%;
	height:100%;
	border-radius:999px;
	background:linear-gradient(90deg, #6f82ef, #3f58d4);
	animation:loadingMove 1.1s ease-in-out infinite;
}

@keyframes spinnerRotate{
	to{
		transform:rotate(360deg);
	}
}

@keyframes loadingMove{
	0%{
		left:-45%;
	}
	100%{
		left:100%;
	}
}

@media (prefers-reduced-motion: reduce){
	.loading_spinner,
	.loading_bar::after{
		animation:none;
	}

	.loading_bar::after{
		left:0;
		width:100%;
	}
}
</style>

</head>

<body>
<div class="result_wrap">

	<div class="loading_card">

		<strong class="result_title">결과를 전송하고 있습니다</strong>

		<p
			class="result_message"
			role="status"
			aria-live="polite">

			잠시만 기다려주세요.

		</p>

		<div class="loading_bar" aria-hidden="true"></div>

	</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/work24-UT/js/ut-common.js"></script>

<script>
$(function() {

	UT.sendResult(

		function() {

			$('.loading_spinner').hide();
			$('.loading_bar').hide();

			$('.result_title')
				.text('전송이 완료되었습니다.');

			$('.result_message')
				.text('참여해주셔서 감사합니다.');

		},

		function() {

			$('.loading_spinner').hide();
			$('.loading_bar').hide();

			$('.result_title')
				.text('전송에 실패했습니다.');

			$('.result_message')
				.text('새로고침 후 다시 시도하거나 담당자에게 문의해주세요.');

		}

	);

});
</script>

</body>
</html>
