<!DOCTYPE html>
<html lang="ko" style="overflow: hidden;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>고용24 사용자 조사 - 메뉴 탐색 테스트</title>

		<link rel="stylesheet" href="/work24-UT/css/reset.css">
		<link rel="stylesheet" href="/work24-UT/css/font.css">
		<link rel="stylesheet" href="/work24-UT/css/common.css">
		<link rel="stylesheet" href="/work24-UT/css/survey.css">
		<link rel="stylesheet" href="/work24-UT/css/ut-test.css">
	</head>

	<body>

		<div id="utPage" class="ut_page" aria-hidden="true">
			<iframe id="testFrame" class="ut_frame" title="고용24 화면 탐색 테스트 화면" src="/work24-UT/asis-b.html" style="overflow-x: hidden;"></iframe>
			<div class="step_floating" role="status" aria-live="polite">
				<div class="survey_head">
					<p class="survey_infotxt">화면 상단 메뉴에서 <span class="aaa_info">'고용정책'</span> 메뉴를 찾아주세요.</p>

					<ol class="step_list" aria-label="조사 진행 단계">
                        <li><span class="sr_only">고용24 사용자 경험 조사</span></li>
                        <li><span class="sr_only">참여 전 확인</span></li>
                        <li><span class="sr_only">설문 방법 안내</span></li>
                        <li class="is_current"><span class="sr_only">현재 단계: 메뉴 탐색 테스트</span></li>
						<li><span class="sr_only">주관식 의견 조사</span></li>
                        <li><span class="sr_only">결과 제출</span></li>
                    </ol>
				</div>
			</div>
		</div>

		<!-- 성공 팝업 -->
		<div id="successPopup" class="ut_result_overlay" role="dialog" aria-modal="true" aria-labelledby="successTitle" aria-describedby="successDesc" hidden>
			<div class="ut_result_box">
				<span class="survey_logo"><img src="/work24-UT/images/logo.svg"></span>
				<h2 id="successTitle" class="ut_alert_title">메뉴를 찾으셨네요!</h2>
				<p id="successDesc" class="ut_alert_desc">다음 단계로 넘어갑니다.</p>
				<button type="button" class="btn_next">두번째 테스트로 이동</button>
			</div>
		</div>

		<!-- 실패 사유 팝업 -->
		<div id="failPopup" class="ut_result_overlay" role="dialog" aria-modal="true" aria-labelledby="failTitle" aria-describedby="failDesc" hidden>
			<div class="ut_result_box">
				<span class="survey_logo"><img src="/work24-UT/images/logo.svg"></span>
				<h2 id="failTitle" class="ut_alert_title">메뉴를 찾기 어려우셨나요?</h2>
				<p id="failDesc" class="ut_alert_desc">시간이 초과되었어요. <br>아래 질문에 답해주시면 다음 단계로 넘어갑니다.</p>
				<fieldset class="fail_radio_group">
					<legend class="sr_only">실패 이유 선택</legend>
					<div class="radio_item">
						<input type="radio" id="failReason01" name="failReason" value="메뉴가 눈에 잘 보이지 않아요.">
						<label for="failReason01">메뉴가 눈에 잘 보이지 않아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason02" name="failReason" value="어느 메뉴 안에 있는지 모르겠어요.">
						<label for="failReason02">어느 메뉴 안에 있는지 모르겠어요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason03" name="failReason" value="메뉴가 너무 많아요.">
						<label for="failReason03">메뉴가 너무 많아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason04" name="failReason" value="메뉴 이름이 생소해요.">
						<label for="failReason04">메뉴 이름이 생소해요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason05" name="failReason" value="메뉴 이름이 기억나지 않아요.">
						<label for="failReason05">메뉴 이름이 기억나지 않아요.</label>
					</div>
					<div class="radio_item">
						<input type="radio" id="failReason06" name="failReason" value="평소에 찾던 경로와 달라요.">
						<label for="failReason06">평소에 찾던 경로와 달라요.</label>
					</div>
				</fieldset>
				<button type="button" class="btn_next">두번째 테스트로 이동</button>
			</div>
		</div>

		<script src="/work24-UT/js/jquery-3.7.1.min.js"></script>
		
		<script>
		$(function () {

			const LIMIT = 40 * 1000;

			const startTime =
				Number(
					sessionStorage.getItem('b_start')
				);

			if (!startTime) {

				alert('시작시간 없음');

				return;

			}

			const remainTime =
				LIMIT - (Date.now() - startTime);

			if (remainTime <= 0) {

				openFail('전체 시간초과');

				return;

			}

			const totalTimer = setTimeout(function () {

				openFail('전체 시간초과');

			}, remainTime);

			function openFail(message) {

				clearTimeout(totalTimer);

				$('#failDesc').html(message);

				$('#failPopup')
					.removeAttr('hidden')
					.css({
						display: 'flex'
					});

			}

			function openSuccess() {

				clearTimeout(totalTimer);

				$('#successPopup')
					.removeAttr('hidden')
					.css({
						display: 'flex'
					});

			}

			const $frame = $('#testFrame');

			function bindFrameEvent() {

				try {

					const frame =
						$frame[0];

					const frameDoc =
						frame.contentWindow.document;

					$(frameDoc)
						.off('click.answer')
						.on(
							'click.answer',
							'a',
							function (e) {

								const $clicked =
									$(this);

								console.log(
									'클릭:',
									$clicked.text()
								);

								if (
									$clicked.attr(
										'data-answer'
									) === 'true'
								) {

									e.preventDefault();

									openSuccess();

								}

							}
						);

				} catch (e) {

					console.log(e);

				}

			}

			$frame.on('load', function () {

				setTimeout(function () {

					bindFrameEvent();

				}, 300);

			});

		});
		</script>
	</body>
</html>
